name: Update README

on:
  push:
    branches: [main]
    paths:
      - "data/papers.json"
      - "scripts/update_readme.py"
      - "README.md"
      - ".github/workflows/update-readme.yml"
  pull_request:
    paths:
      - "data/papers.json"
      - "scripts/update_readme.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate and render README
        run: python scripts/update_readme.py

      - name: Verify generated content
        run: python scripts/update_readme.py --check

      - name: Commit generated changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update README statistics"
          git push

      - name: Require generated README in pull requests
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- README.md
